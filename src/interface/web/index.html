<!doctype html>
<html lang="id" data-title-key="chat.title">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LumiAssist</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><img class="brand-mark" src="/logo-mark.png" alt="" width="36" height="40"><div class="brand-text"><h1 aria-label="LumiAssist"><span class="lumi">Lumi</span><span class="assist">Assist</span></h1><p data-i18n="chat.tagline">Cerdas, ramah, dan sesuai data resmi</p></div></div>
      <div class="actions-top">
        <div class="lang-switch" role="group" data-i18n-aria-label="lang.label" aria-label="Bahasa"><button type="button" data-lang="id" aria-pressed="true">ID</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
        <a class="ghost" href="/admin.html" data-i18n="chat.admin">Admin</a><button id="clear" class="ghost" type="button" data-i18n="chat.newChat">Percakapan baru</button>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite">
      <section id="welcome" class="welcome">
        <h2 data-i18n="chat.welcome">Halo! Apa yang ingin Anda ketahui?</h2>
        <div class="suggestions">
          <button type="button" data-i18n="chat.s1">Berapa lama pengiriman ke luar Jawa?</button>
          <button type="button" data-i18n="chat.s2">Bagaimana cara mengembalikan barang?</button>
          <button type="button" data-i18n="chat.s3">Metode pembayaran apa saja yang tersedia?</button>
          <button type="button" data-i18n="chat.s4">Kapan jam layanan dukungan?</button>
        </div>
      </section>
    </main>

    <form id="form" class="composer" autocomplete="off">
      <textarea id="input" rows="1" maxlength="1000" placeholder="Tulis pertanyaan…" aria-label="Pertanyaan" data-i18n-placeholder="chat.placeholder" data-i18n-aria-label="chat.question"></textarea>
      <button id="send" type="submit" aria-label="Kirim" data-i18n-aria-label="chat.send">➤</button>
    </form>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
